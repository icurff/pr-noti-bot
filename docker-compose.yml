services:
  # 1. PR Notification Bot (Node.js 20 Express + Discord Bot)
  prbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prbot
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - STATE_DIR=/app/state
    volumes:
      - ./state:/app/state

  # 2. Caddy Reverse Proxy (Tự động cấp & gia hạn SSL Let's Encrypt 100%)
  caddy:
    image: caddy:2-alpine
    container_name: prbot_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - prbot

volumes:
  caddy_data:
  caddy_config:
